<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دایناسور برو | بازی پرش</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, Arial, sans-serif;
      --green: #66bb6a;
      --dark-green: #1b5e20;
      --blue: #1687c9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: linear-gradient(145deg, #b8e8ff, #eaf8ff 55%, #d5f1ff);
      color: #17324d;
    }

    .game {
      width: min(94vw, 860px);
      padding: clamp(1rem, 4vw, 2rem);
      border: 1px solid rgba(22, 135, 201, .18);
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 18px 50px rgba(20, 104, 151, .2);
      text-align: center;
    }

    h1 { margin: 0; color: var(--dark-green); font-size: clamp(1.6rem, 4vw, 2.3rem); }
    .subtitle { margin: .45rem 0 1rem; color: #49657a; }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: .65rem;
      font-weight: 700;
      color: #15537b;
    }

    .hud span { color: #0d73aa; }

    .board {
      position: relative;
      overflow: hidden;
      border: 3px solid #55b7e8;
      border-radius: .9rem;
      background: #dff5ff;
      box-shadow: inset 0 -18px 30px rgba(90, 193, 236, .18);
    }

    svg { display: block; width: 100%; height: auto; min-height: 220px; }

    .dinosaur-group { transition: transform 70ms linear; }
    .dinosaur { fill: #66bb6a; stroke: #1b5e20; stroke-width: 2; }
    .obstacle { fill: #ef704f; stroke: #a83b2b; stroke-width: 2; }
    .cloud { fill: rgba(255, 255, 255, .75); }

    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: .55rem;
      background: rgba(9, 66, 102, .18);
      color: #123b55;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .message[hidden] { display: none; }
    .message small { font-size: .85rem; font-weight: 400; }

    .controls {
      margin: .8rem 0 1rem;
      color: #49657a;
      font-size: .92rem;
    }

    button {
      border: 0;
      border-radius: .6rem;
      padding: .72rem 1.5rem;
      color: #fff;
      background: var(--blue);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      box-shadow: 0 4px 0 #0d6597;
    }

    button:hover { background: #0d73aa; }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #0d6597; }
    button:focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="game">
    <h1>دایناسور برو</h1>
    <p class="subtitle">از موانع بپر و رکوردت را بهتر کن!</p>

    <div class="hud" aria-label="اطلاعات بازی">
      <div>امتیاز: <span id="score">۰</span></div>
      <div id="status" aria-live="polite">برای شروع آماده‌ای؟</div>
    </div>

    <section class="board" aria-label="زمین بازی دایناسور">
      <svg id="game-canvas" viewBox="0 0 800 300" role="img" aria-label="دایناسور سبز در حال عبور از موانع">
        <circle class="cloud" cx="120" cy="55" r="24" />
        <circle class="cloud" cx="145" cy="48" r="32" />
        <circle class="cloud" cx="180" cy="58" r="20" />
        <circle class="cloud" cx="610" cy="72" r="22" />
        <circle class="cloud" cx="638" cy="63" r="30" />
        <circle class="cloud" cx="675" cy="74" r="18" />
        <line x1="0" y1="250" x2="800" y2="250" stroke="#1687c9" stroke-width="4" />
        <g id="obstacles" aria-label="موانع"></g>
        <g id="dinosaur" class="dinosaur-group" data-x="70" data-y="180" aria-label="دایناسور سبز">
          <path class="dinosaur" d="M4 70h30V38c0-21 13-34 34-34h35c14 0 25 11 25 25v8h27c9 0 16 7 16 16v17h-22V59h-12v20h-24V66h-14v14H76V65H60v15H39V70H4z" />
          <circle cx="98" cy="18" r="4" fill="#fff" />
          <circle cx="98" cy="18" r="2" fill="#111" />
          <path d="M126 42h18" stroke="#1b5e20" stroke-width="3" />
        </g>
      </svg>
      <div id="message" class="message">
        <div id="message-title">آماده‌ای؟</div>
        <small>برای شروع روی دکمه بزن</small>
      </div>
    </section>

    <p class="controls">پرش: فاصله، W یا ↑ &nbsp; | &nbsp; حرکت: A و D یا ← و →</p>
    <button type="button" id="start">شروع بازی</button>
  </main>

  <script>
    (function () {
      const dinosaur = document.getElementById('dinosaur');
      const obstaclesElement = document.getElementById('obstacles');
      const scoreElement = document.getElementById('score');
      const statusElement = document.getElementById('status');
      const message = document.getElementById('message');
      const messageTitle = document.getElementById('message-title');
      const startButton = document.getElementById('start');
      const WIDTH = 800;
      const GROUND = 180;
      const DINO_WIDTH = 145;
      const DINO_HEIGHT = 80;
      const state = { running: false, gameOver: false, x: 70, y: GROUND, velocityY: 0, score: 0, speed: 5, lastTime: 0, spawnTimer: 0, obstacles: [], animation: 0 };

      function showNumber(number) {
        return Math.floor(number).toLocaleString('fa-IR');
      }

      function renderDinosaur() {
        dinosaur.setAttribute('transform', 'translate(' + state.x + ' ' + state.y + ')');
        dinosaur.dataset.x = String(Math.round(state.x));
        dinosaur.dataset.y = String(Math.round(state.y));
      }

      function renderObstacles() {
        obstaclesElement.replaceChildren();
        state.obstacles.forEach(function (obstacle) {
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('class', 'obstacle');
          rect.setAttribute('x', obstacle.x);
          rect.setAttribute('y', 250 - obstacle.height);
          rect.setAttribute('width', obstacle.width);
          rect.setAttribute('height', obstacle.height);
          rect.setAttribute('rx', '5');
          obstaclesElement.appendChild(rect);
        });
      }

      function jump() {
        if (!state.running || state.y < GROUND - 1) return;
        state.velocityY = -13;
      }

      function move(horizontal) {
        if (!state.running) return;
        state.x = Math.max(12, Math.min(230, state.x + horizontal));
        renderDinosaur();
      }

      function intersects(obstacle) {
        const dinoLeft = state.x + 8;
        const dinoRight = state.x + DINO_WIDTH - 10;
        const dinoTop = state.y + 8;
        const dinoBottom = state.y + DINO_HEIGHT;
        const obstacleTop = 250 - obstacle.height;
        return dinoRight > obstacle.x && dinoLeft < obstacle.x + obstacle.width && dinoBottom > obstacleTop && dinoTop < 250;
      }

      function endGame() {
        state.running = false;
        state.gameOver = true;
        cancelAnimationFrame(state.animation);
        statusElement.textContent = 'بازی تمام شد';
        messageTitle.textContent = 'باختی! امتیاز: ' + showNumber(state.score);
        message.querySelector('small').textContent = 'برای تلاش دوباره روی دکمه بزن';
        message.hidden = false;
        startButton.textContent = 'شروع دوباره';
      }

      function frame(time) {
        if (!state.running) return;
        const delta = Math.min(32, time - state.lastTime || 16);
        state.lastTime = time;
        state.score += delta * .012;
        state.speed = 5 + Math.min(4, state.score / 180);
        state.spawnTimer += delta;

        state.velocityY += .62 * (delta / 16);
        state.y += state.velocityY * (delta / 16);
        if (state.y >= GROUND) { state.y = GROUND; state.velocityY = 0; }
        renderDinosaur();

        if (state.spawnTimer > Math.max(650, 1250 - state.score * 2)) {
          state.spawnTimer = 0;
          const height = 35 + Math.random() * 35;
          state.obstacles.push({ x: WIDTH + 10, width: 24 + Math.random() * 18, height: height });
        }
        state.obstacles.forEach(function (obstacle) { obstacle.x -= state.speed * (delta / 16); });
        state.obstacles = state.obstacles.filter(function (obstacle) { return obstacle.x > -60; });
        renderObstacles();
        scoreElement.textContent = showNumber(state.score);
        if (state.obstacles.some(intersects)) { endGame(); return; }
        state.animation = requestAnimationFrame(frame);
      }

      function startGame() {
        cancelAnimationFrame(state.animation);
        state.running = true;
        state.gameOver = false;
        state.x = 70;
        state.y = GROUND;
        state.velocityY = 0;
        state.score = 0;
        state.speed = 5;
        state.spawnTimer = 0;
        state.obstacles = [];
        renderDinosaur();
        renderObstacles();
        scoreElement.textContent = '۰';
        statusElement.textContent = 'بازی در حال اجراست';
        message.hidden = true;
        startButton.textContent = 'شروع دوباره';
        state.lastTime = performance.now();
        state.animation = requestAnimationFrame(frame);
      }

      document.addEventListener('keydown', function (event) {
        const key = event.key.toLowerCase();
        if ([' ', 'arrowup', 'w'].includes(key)) {
          event.preventDefault();
          if (!state.running && !state.gameOver) startGame();
          else jump();
        } else if (['arrowleft', 'a'].includes(key)) {
          event.preventDefault();
          move(-12);
        } else if (['arrowright', 'd'].includes(key)) {
          event.preventDefault();
          move(12);
        }
      });

      startButton.addEventListener('click', startGame);
      renderDinosaur();
    }());
  </script>
</body>
</html>

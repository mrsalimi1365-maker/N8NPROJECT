<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>حضور و غیاب</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>حضور و غیاب</h1>
      <p>مدیریت ساده و آفلاین حضور کارکنان</p>
    </div>
    <div class="toolbar">
      <button id="backupBtn" class="secondary">پشتیبان‌گیری</button>
      <button id="restoreBtn" class="secondary">بازیابی</button>
      <input id="restoreInput" type="file" accept="application/json" hidden>
      <button id="clearBtn" class="danger">پاک‌سازی همه</button>
    </div>
  </header>

  <main class="container">
    <section class="panel controls-panel">
      <div class="field grow">
        <label for="selectedDate">تاریخ ثبت</label>
        <input id="selectedDate" type="date">
      </div>
      <div class="field grow">
        <label for="searchInput">جست‌وجو</label>
        <input id="searchInput" type="search" placeholder="نام، شناسه یا گروه..."></div>
      <div class="field">
        <label for="groupFilter">گروه</label>
        <select id="groupFilter"><option value="">همه گروه‌ها</option></select>
      </div>
      <div class="field">
        <label for="statusFilter">وضعیت</label>
        <select id="statusFilter"><option value="">همه وضعیت‌ها</option><option value="present">حاضر</option><option value="absent">غایب</option><option value="late">تأخیر</option><option value="leave">مرخصی</option><option value="mission">مأموریت</option></select>
      </div>
    </section>

    <section id="stats" class="stats"></section>

    <section class="layout">
      <div class="panel main-panel">
        <div class="section-title"><div><h2>فهرست افراد</h2><span id="listInfo"></span></div><button id="addPersonBtn" class="primary">＋ افزودن فرد</button></div>
        <div id="peopleTable" class="table-wrap"></div>
      </div>
      <aside class="panel form-panel" id="personPanel">
        <div class="section-title"><h2 id="formTitle">افزودن فرد</h2><button id="closeFormBtn" class="icon-btn" aria-label="بستن">×</button></div>
        <form id="personForm">
          <input id="personId" type="hidden">
          <div class="field"><label for="personName">نام و نام خانوادگی *</label><input id="personName" required maxlength="80"></div>
          <div class="field"><label for="personCode">شناسه *</label><input id="personCode" required maxlength="30"></div>
          <div class="field"><label for="personGroup">گروه یا بخش</label><input id="personGroup" maxlength="60"></div>
          <div class="field"><label for="personNote">توضیحات</label><textarea id="personNote" rows="3" maxlength="300"></textarea></div>
          <div class="form-actions"><button type="submit" class="primary">ذخیره</button><button type="button" id="cancelFormBtn" class="secondary">انصراف</button></div>
        </form>
      </aside>
    </section>

    <section class="panel report-panel">
      <div class="section-title"><div><h2>گزارش بازه‌ای</h2><span>آمار بر اساس بازه و گروه انتخابی</span></div><div class="toolbar"><button id="csvBtn" class="secondary">خروجی CSV</button><button id="printBtn" class="secondary">چاپ گزارش</button></div></div>
      <div class="report-filters">
        <div class="field"><label for="fromDate">از تاریخ</label><input id="fromDate" type="date"></div>
        <div class="field"><label for="toDate">تا تاریخ</label><input id="toDate" type="date"></div>
        <div class="field"><label for="reportGroup">گروه</label><select id="reportGroup"><option value="">همه گروه‌ها</option></select></div>
      </div>
      <div id="reportSummary" class="report-summary"></div>
      <div id="reportTable" class="table-wrap"></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

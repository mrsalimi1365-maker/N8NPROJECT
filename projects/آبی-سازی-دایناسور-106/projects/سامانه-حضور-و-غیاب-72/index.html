<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حضور و غیاب</title>
  <style>
    :root{--primary:#2563eb;--bg:#f4f7fb;--text:#172033;--muted:#64748b;--border:#dbe3ef;--success:#16a34a;--danger:#dc2626;--warning:#d97706;--purple:#7c3aed}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.container{width:min(1180px,calc(100% - 28px));margin:auto}.topbar{background:#fff;border-bottom:1px solid var(--border);padding:18px 0;margin-bottom:24px}.topbar .container{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{background:var(--primary);color:white;border-radius:12px;padding:8px 12px;font-size:24px}.brand h1{font-size:22px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.button,button{border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;transition:.2s}.button.primary,button.primary{background:var(--primary);color:#fff}.button.secondary,button.secondary{background:#e9eff8;color:#27405f}.button.danger{background:#fee2e2;color:#991b1b}.button:hover,button:hover{filter:brightness(.96);transform:translateY(-1px)}.toolbar,.panel,.stat{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 12px #1e3a8a08}.toolbar{padding:16px;display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:170px}.field label{font-size:13px;font-weight:bold;color:#475569}.field input,.field select{border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff;color:var(--text);font:inherit;outline:none}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #2563eb18}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{padding:16px;display:flex;justify-content:space-between;align-items:center}.stat .number{font-size:27px;font-weight:bold}.stat .label{font-size:13px;color:var(--muted)}.stat .emoji{font-size:28px}.stat.present .number{color:var(--success)}.stat.absent .number{color:var(--danger)}.stat.late .number{color:var(--warning)}.stat.leave .number{color:var(--purple)}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:20px}.panel{padding:18px;margin-bottom:20px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel h2{font-size:18px;margin:0}.count{color:var(--muted);font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:right;padding:12px 8px;border-bottom:1px solid #edf1f6}th{font-size:13px;color:var(--muted);font-weight:bold}td{font-size:14px}.person-name{font-weight:bold}.status-select{min-width:130px;padding:7px;border-radius:7px;border:1px solid #cbd5e1;font:inherit;background:#fff}.row-actions{display:flex;gap:5px}.small{padding:6px 9px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.history-item{border-bottom:1px solid #edf1f6;padding:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.history-date{font-weight:bold;font-size:13px}.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:bold}.badge.present{background:#dcfce7;color:#166534}.badge.absent{background:#fee2e2;color:#991b1b}.badge.late{background:#fef3c7;color:#92400e}.badge.leave{background:#ede9fe;color:#5b21b6}.muted{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:22px;right:22px;background:#172033;color:#fff;padding:11px 17px;border-radius:9px;opacity:0;transform:translateY(15px);pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:none}.file-label{display:inline-block}.hidden{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.topbar .container{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button,.actions label{flex:1;text-align:center}}@media(max-width:430px){.stats{gap:8px}.stat{padding:11px}.stat .number{font-size:22px}.stat .emoji{font-size:22px}.container{width:min(100% - 18px,1180px)}.panel{padding:12px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="container"><div class="brand"><span class="brand-icon">✓</span><div><h1>حضور و غیاب</h1><p>مدیریت ساده و آفلاین حضور افراد</p></div></div><div class="actions"><button class="button secondary" id="exportBtn">خروجی JSON</button><label class="button secondary file-label" for="importInput">ورودی JSON</label><input id="importInput" class="hidden" type="file" accept="application/json"></div></div></header>
  <main class="container">
    <section class="toolbar"><div class="field"><label for="selectedDate">تاریخ ثبت</label><input id="selectedDate" type="date"></div><div class="field"><label for="searchInput">جست‌وجوی افراد</label><input id="searchInput" type="search" placeholder="نام فرد را وارد کنید"></div><div class="field"><label for="statusFilter">فیلتر وضعیت</label><select id="statusFilter"><option value="all">همه وضعیت‌ها</option><option value="present">حاضر</option><option value="absent">غایب</option><option value="late">تأخیر</option><option value="leave">مرخصی</option><option value="none">ثبت نشده</option></select></div></section>
    <section class="stats"><div class="stat present"><div><div class="number" id="presentCount">۰</div><div class="label">حاضر</div></div><span class="emoji">✅</span></div><div class="stat absent"><div><div class="number" id="absentCount">۰</div><div class="label">غایب</div></div><span class="emoji">❌</span></div><div class="stat late"><div><div class="number" id="lateCount">۰</div><div class="label">تأخیر</div></div><span class="emoji">⏰</span></div><div class="stat leave"><div><div class="number" id="leaveCount">۰</div><div class="label">مرخصی</div></div><span class="emoji">🏖️</span></div></section>
    <div class="layout"><section class="panel"><div class="panel-heading"><h2>فهرست افراد</h2><span class="count" id="peopleCount"></span></div><form id="personForm" class="toolbar" style="padding:0;border:0;box-shadow:none;margin:0 0 15px"><div class="field"><label for="personName">نام فرد جدید</label><input id="personName" maxlength="80" required placeholder="مثلاً سارا احمدی"></div><button class="primary" type="submit">افزودن فرد</button></form><div class="table-wrap"><table><thead><tr><th>نام</th><th>وضعیت امروز</th><th>عملیات</th></tr></thead><tbody id="peopleBody"></tbody></table><div id="peopleEmpty" class="empty hidden">هنوز فردی ثبت نشده است. از فرم بالا شروع کنید.</div></div></section>
      <aside class="panel"><div class="panel-heading"><h2>سوابق ثبت‌شده</h2><span class="count" id="historyCount"></span></div><div class="field" style="margin-bottom:10px"><label for="historySearch">جست‌وجوی سوابق</label><input id="historySearch" type="search" placeholder="نام فرد یا تاریخ"></div><div id="historyList"></div><div id="historyEmpty" class="empty hidden">هنوز سابقه‌ای ثبت نشده است.</div></aside>
    </div>
  </main><div id="toast" class="toast"></div>
  <script>
    const KEY='attendance-data-v1', statuses={present:'حاضر',absent:'غایب',late:'تأخیر',leave:'مرخصی'};
    let data=load(), editingId=null;
    const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10);
    $('selectedDate').value=today();
    function load(){try{const value=JSON.parse(localStorage.getItem(KEY));return value&&Array.isArray(value.people)&&value.records?value:{people:[],records:{}}}catch{return {people:[],records:{}}}}
    function save(){localStorage.setItem(KEY,JSON.stringify(data))}
    function esc(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function faNumber(value){return String(value).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
    function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.remove('show'),2500)}
    function currentStatus(id){return (data.records[$('selectedDate').value]||{})[id]||''}
    function render(){renderPeople();renderStats();renderHistory()}
    function renderPeople(){const query=$('searchInput').value.trim().toLowerCase(), filter=$('statusFilter').value, date=$('selectedDate').value;const rows=data.people.filter(p=>p.name.toLowerCase().includes(query)).filter(p=>filter==='all'||(data.records[date]?.[p.id]||'none')===filter);$('peopleCount').textContent=faNumber(rows.length)+' نفر';$('peopleEmpty').classList.toggle('hidden',rows.length!==0);$('peopleBody').innerHTML=rows.map(p=>{const status=currentStatus(p.id);return `<tr><td class="person-name">${esc(p.name)}</td><td><select class="status-select" data-id="${p.id}"><option value="">ثبت نشده</option>${Object.entries(statuses).map(([key,label])=>`<option value="${key}" ${status===key?'selected':''}>${label}</option>`).join('')}</select></td><td><div class="row-actions"><button class="button secondary small edit" data-id="${p.id}">ویرایش</button><button class="button danger small delete" data-id="${p.id}">حذف</button></div></td></tr>`}).join('')}
    function renderStats(){const records=data.records[$('selectedDate').value]||{};Object.keys(statuses).forEach(s=>$(s+'Count').textContent=faNumber(Object.values(records).filter(v=>v===s).length))}
    function renderHistory(){const query=$('historySearch').value.trim().toLowerCase(),items=[];Object.entries(data.records).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([date,record])=>Object.entries(record).forEach(([id,status])=>{const person=data.people.find(p=>p.id===id);if(person&&(!query||(person.name+' '+date+' '+statuses[status]).toLowerCase().includes(query)))items.push({date,person:person.name,status,id})}));$('historyCount').textContent=faNumber(items.length)+' رکورد';$('historyEmpty').classList.toggle('hidden',items.length!==0);$('historyList').innerHTML=items.map(x=>`<div class="history-item"><div><div class="history-date">${esc(x.person)}</div><div class="muted">${esc(x.date)}</div></div><div><span class="badge ${x.status}">${statuses[x.status]}</span> <button class="button danger small record-delete" data-date="${x.date}" data-id="${x.id}">حذف</button></div></div>`).join('')}
    $('personForm').addEventListener('submit',e=>{e.preventDefault();const name=$('personName').value.trim();if(name.length<2){notify('نام باید حداقل دو حرف داشته باشد.');return}if(data.people.some(p=>p.name.toLowerCase()===name.toLowerCase())){notify('این نام قبلاً ثبت شده است.');return}data.people.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),name});save();$('personName').value='';render();notify('فرد با موفقیت افزوده شد.')});
    $('peopleBody').addEventListener('change',e=>{if(!e.target.matches('.status-select'))return;const id=e.target.dataset.id,date=$('selectedDate').value;data.records[date]??={};if(e.target.value)data.records[date][id]=e.target.value;else delete data.records[date][id];if(!Object.keys(data.records[date]).length)delete data.records[date];save();render();notify('وضعیت ثبت شد.')});
    $('peopleBody').addEventListener('click',e=>{const id=e.target.dataset.id;if(e.target.matches('.delete')){const p=data.people.find(x=>x.id===id);if(confirm(`آیا حذف «${p.name}» و همه سوابق او را تأیید می‌کنید؟`)){data.people=data.people.filter(x=>x.id!==id);Object.keys(data.records).forEach(d=>{delete data.records[d][id];if(!Object.keys(data.records[d]).length)delete data.records[d]});save();render();notify('فرد حذف شد.')}}if(e.target.matches('.edit')){const p=data.people.find(x=>x.id===id),name=prompt('نام جدید را وارد کنید:',p.name)?.trim();if(name&&name!==p.name){if(data.people.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){notify('این نام قبلاً ثبت شده است.');return}p.name=name;save();render();notify('نام ویرایش شد.')}}});
    $('historyList').addEventListener('click',e=>{if(!e.target.matches('.record-delete'))return;const {date,id}=e.target.dataset;if(confirm('این رکورد حذف شود؟')){delete data.records[date][id];if(!Object.keys(data.records[date]).length)delete data.records[date];save();render();notify('رکورد حذف شد.')}});
    ['selectedDate','searchInput','statusFilter','historySearch'].forEach(id=>$(id).addEventListener(id==='selectedDate'?'change':'input',render));
    $('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='attendance-backup.json';a.click();URL.revokeObjectURL(url);notify('فایل پشتیبان آماده شد.')});
    $('importInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(reader.result);if(!Array.isArray(value.people)||!value.records)throw Error();if(confirm('اطلاعات فعلی با فایل انتخاب‌شده جایگزین شود؟')){data=value;save();render();notify('اطلاعات بازیابی شد.')}}catch{notify('فایل JSON معتبر نیست.')}e.target.value=''};reader.readAsText(file)});
    render();
  </script>
</body>
</html>

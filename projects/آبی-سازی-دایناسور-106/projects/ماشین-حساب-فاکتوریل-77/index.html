<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاسبهٔ فاکتوریل</title>
  <style>
    :root {
      font-family: Tahoma, Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    main {
      width: min(100%,  thirtyrem);
      max-width: 30rem;
      padding: 2rem;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #2563eb;
      font-size: 1.8rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      min-height: 2.8rem;
      border-radius: 0.5rem;
      font: inherit;
    }

    input {
      padding: 0.6rem;
      border: 1px solid #cbd5e1;
      direction: ltr;
      text-align: right;
    }

    button {
      margin-top: 1rem;
      border: 0;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    #result {
      min-height: 3rem;
      margin: 1.5rem 0 0;
      padding: 1rem;
      border-radius: 0.5rem;
      background: #eff6ff;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b91c1c;
      background: #fef2f2 !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>محاسبهٔ فاکتوریل</h1>
    <form id="factorial-form">
      <label for="number">یک عدد صحیح نامنفی وارد کنید:</label>
      <input id="number" name="number" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً 5">
      <button type="submit">محاسبه</button>
    </form>
    <p id="result" aria-live="polite">نتیجه اینجا نمایش داده می‌شود.</p>
  </main>

  <script src="factorial.js"></script>
  <script>
    const form = document.getElementById('factorial-form');
    const input = document.getElementById('number');
    const result = document.getElementById('result');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      result.classList.remove('error');

      if (!window.factorialUtils.isValidInput(input.value)) {
        result.textContent = 'لطفاً یک عدد صحیح نامنفی وارد کنید.';
        result.classList.add('error');
        return;
      }

      const value = input.value.trim();
      const answer = window.factorialUtils.factorial(value).toString();
      result.textContent = value + '! = ' + answer;
    });
  </script>
</body>
</html>

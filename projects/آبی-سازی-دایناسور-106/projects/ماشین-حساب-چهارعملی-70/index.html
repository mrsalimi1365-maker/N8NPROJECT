<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماشین‌حساب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="ماشین‌حساب">
    <h1>ماشین‌حساب</h1>
    <section class="display" aria-live="polite">
      <div id="expression" class="expression"></div>
      <div id="display" class="display-value">۰</div>
    </section>

    <section class="keypad" aria-label="صفحه‌کلید ماشین‌حساب">
      <button class="function" data-action="clear">پاک‌کردن</button>
      <button class="function" data-action="backspace" aria-label="حذف آخرین رقم">⌫</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">۷</button>
      <button data-value="8">۸</button>
      <button data-value="9">۹</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">۴</button>
      <button data-value="5">۵</button>
      <button data-value="6">۶</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">۱</button>
      <button data-value="2">۲</button>
      <button data-value="3">۳</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-value="0">۰</button>
      <button data-value=".">.</button>
    </section>
    <p class="hint">برای ورود از صفحه‌کلید رایانه نیز می‌توانید استفاده کنید.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>

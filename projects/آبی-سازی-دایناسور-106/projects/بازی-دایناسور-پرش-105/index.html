<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>دایناسور آفلاین</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <h1>دایناسور آفلاین</h1>
        <p id="status" aria-live="polite">برای شروع، اسپیس یا لمس صفحه را بزنید</p>
      </div>
      <div class="scores" aria-label="امتیازها">
        <span>امتیاز: <b id="score">00000</b></span>
        <span>رکورد: <b id="best">00000</b></span>
      </div>
    </header>

    <section class="game-card" aria-label="محیط بازی">
      <canvas id="game" width="900" height="300" tabindex="0" aria-label="بازی دایناسور"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">آماده‌ای؟</h2>
        <p id="overlay-text">با پریدن از روی کاکتوس‌ها رکورد بزن</p>
        <button id="restart" type="button">شروع بازی</button>
      </div>
    </section>

    <p class="help">کنترل: <kbd>Space</kbd> یا <kbd>↑</kbd> برای پرش · لمس صفحه برای موبایل</p>
  </main>
  <script src="game-core.js"></script>
  <script src="game.js"></script>
</body>
</html>

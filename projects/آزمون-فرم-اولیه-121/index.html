<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آزمون فرم اولیه</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #eef4ff, #f9fbff);
    }

    main {
      width: min(100%, 560px);
      padding: 40px 24px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5eaf2;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(31, 52, 85, 0.1);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      line-height: 1.4;
    }

    p {
      margin: 0 auto 28px;
      color: #657188;
      line-height: 1.9;
    }

    button {
      min-width: 140px;
      padding: 13px 24px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>آزمون فرم اولیه</h1>
    <p>یک شروع ساده، روشن و آماده برای قدم بعدی.</p>
    <button type="button">شروع</button>
  </main>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماشین حساب</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main class="calculator" aria-label="ماشین حساب">
    <header>
      <h1>ماشین حساب</h1>
      <p>جمع، تفریق، ضرب و تقسیم</p>
    </header>

    <section class="display-area">
      <div id="display" class="display" role="status" aria-live="polite">0</div>
    </section>

    <section class="keys" aria-label="کلیدهای ماشین حساب">
      <button class="action" data-action="clear">پاک کردن</button>
      <button class="action" data-action="delete" aria-label="حذف آخرین ورودی">⌫</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">۷</button>
      <button data-value="8">۸</button>
      <button data-value="9">۹</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">۴</button>
      <button data-value="5">۵</button>
      <button data-value="6">۶</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">۱</button>
      <button data-value="2">۲</button>
      <button data-value="3">۳</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-value="0">۰</button>
      <button data-value=".">٫</button>
    </section>
    <p class="hint">راهنما: از صفحه‌کلید نیز می‌توانید استفاده کنید.</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نقاشی ساده</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">ابزار خلاقیت</p>
        <h1>نقاشی ساده</h1>
        <p class="subtitle">ایده‌هایتان را روی بوم بکشید.</p>
      </div>
      <div class="header-mark" aria-hidden="true">✦</div>
    </header>

    <section class="toolbar" aria-label="ابزارهای نقاشی">
      <div class="control-group color-group">
        <label for="colorPicker">رنگ قلم</label>
        <input id="colorPicker" type="color" value="#24324a" aria-label="انتخاب رنگ قلم">
      </div>

      <div class="control-group size-group">
        <label for="brushSize">اندازه قلم <output id="sizeValue" for="brushSize">8</output> پیکسل</label>
        <input id="brushSize" type="range" min="1" max="60" value="8">
      </div>

      <div class="tool-buttons">
        <button id="eraserButton" class="tool-button" type="button" aria-pressed="false">پاک‌کن</button>
        <button id="undoButton" class="tool-button" type="button">بازگشت</button>
        <button id="clearButton" class="tool-button danger" type="button">پاک کردن بوم</button>
        <button id="saveButton" class="tool-button primary" type="button">ذخیره PNG</button>
      </div>
    </section>

    <section class="canvas-card">
      <div class="canvas-wrap">
        <canvas id="drawingCanvas" aria-label="بوم نقاشی">مرورگر شما از بوم نقاشی پشتیبانی نمی‌کند.</canvas>
      </div>
      <p class="hint">برای نقاشی، با ماوس یا انگشت روی بوم بکشید.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>

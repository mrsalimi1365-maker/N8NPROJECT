<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دایناسور برو</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8f5e9;
    }

    .game {
      width: min(92vw, 760px);
      padding: 2rem;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(46, 125, 50, 0.18);
      text-align: center;
    }

    h1 {
      color: #1b5e20;
      margin-top: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 1rem 0;
      border: 2px solid #81c784;
      border-radius: 0.5rem;
      background: #f1f8e9;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      margin: 1rem 0;
      border: 2px solid #81c784;
      border-radius: 0.5rem;
      background: #f1f8e9;
    }

    .dinosaur-group {
      transition: transform 100ms ease-out;
    }

    .dinosaur {
      fill: #66bb6a;
      stroke: #1b5e20;
      stroke-width: 2;
    }

    button {
      border: 0;
      border-radius: 0.5rem;
      padding: 0.7rem 1.2rem;
      color: #fff;
      background: #2e7d32;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #1b5e20;
    }

    .hint {
      color: #2e7d32;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>دایناسور برو</h1>
    <p>دایناسور سبز آمادهٔ حرکت است!</p>
    <p class="hint">با کلیدهای جهت‌دار یا W A S D حرکت کنید.</p>
    <svg viewBox="0 0 320 160" role="img" aria-label="دایناسور سبز">
      <g id="dinosaur" class="dinosaur-group" data-x="0" data-y="0" aria-label="موقعیت دایناسور">
        <path class="dinosaur" d="M70 112h34V74c0-21 16-36 38-36h44c17 0 30 13 30 30v8h35c10 0 18 8 18 18v18h-25v-12h-13v24h-31v-12h-15v12h-25v-15h-22v15H70z" />
        <circle cx="184" cy="55" r="4" fill="#fff" />
        <circle cx="184" cy="55" r="2" fill="#111" />
        <path d="M220 76h20" stroke="#1b5e20" stroke-width="3" />
      </g>
      <line x1="0" y1="128" x2="320" y2="128" stroke="#66bb6a" stroke-width="3" />
    </svg>
    <p id="status" aria-live="polite">موقعیت: ۰، ۰</p>
    <button type="button" id="start">شروع بازی</button>
  </main>
  <script>
    (function () {
      const dinosaur = document.getElementById('dinosaur');
      const status = document.getElementById('status');
      const startButton = document.getElementById('start');
      const STEP = 10;
      const LIMITS = { minX: 0, maxX: 51, minY: 0, maxY: 32 };
      const position = { x: 0, y: 0 };

      function updateDinosaur() {
        dinosaur.setAttribute('transform', 'translate(' + position.x + ' ' + position.y + ')');
        dinosaur.dataset.x = String(position.x);
        dinosaur.dataset.y = String(position.y);
        status.textContent = 'موقعیت: ' + position.x + '، ' + position.y;
      }

      function moveDinosaur(dx, dy) {
        position.x = Math.max(LIMITS.minX, Math.min(LIMITS.maxX, position.x + dx));
        position.y = Math.max(LIMITS.minY, Math.min(LIMITS.maxY, position.y + dy));
        updateDinosaur();
      }

      document.addEventListener('keydown', function (event) {
        const key = event.key.toLowerCase();
        const moves = {
          arrowleft: [-STEP, 0],
          a: [-STEP, 0],
          arrowright: [STEP, 0],
          d: [STEP, 0],
          arrowup: [0, -STEP],
          w: [0, -STEP],
          arrowdown: [0, STEP],
          s: [0, STEP]
        };
        const move = moves[key];
        if (!move) return;
        event.preventDefault();
        moveDinosaur(move[0], move[1]);
      });

      startButton.addEventListener('click', function () {
        this.textContent = 'بازی شروع شد!';
        dinosaur.focus();
      });

      updateDinosaur();
    }());
  </script>
</body>
</html>

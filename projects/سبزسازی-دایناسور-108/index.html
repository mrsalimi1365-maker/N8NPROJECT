<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دایناسور برو</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8f5e9;
    }

    .game {
      width: min(92vw, 760px);
      padding: 2rem;
      border-radius: 1rem;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(46, 125, 50, 0.18);
      text-align: center;
    }

    h1 {
      color: #1b5e20;
      margin-top: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 1rem 0;
      border: 2px solid #81c784;
      border-radius: 0.5rem;
      background: #f1f8e9;
    }

    .dinosaur {
      fill: #2e7d32;
      stroke: #1b5e20;
      stroke-width: 2;
    }

    button {
      border: 0;
      border-radius: 0.5rem;
      padding: 0.7rem 1.2rem;
      color: #fff;
      background: #2e7d32;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #1b5e20;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>دایناسور برو</h1>
    <p>دایناسور سبز آمادهٔ حرکت است!</p>
    <svg viewBox="0 0 320 160" role="img" aria-label="دایناسور سبز">
      <path class="dinosaur" d="M70 112h34V74c0-21 16-36 38-36h44c17 0 30 13 30 30v8h35c10 0 18 8 18 18v18h-25v-12h-13v24h-31v-12h-15v12h-25v-15h-22v15H70z" />
      <circle cx="184" cy="55" r="4" fill="#fff" />
      <circle cx="184" cy="55" r="2" fill="#111" />
      <path d="M220 76h20" stroke="#1b5e20" stroke-width="3" />
      <line x1="0" y1="128" x2="320" y2="128" stroke="#66bb6a" stroke-width="3" />
    </svg>
    <button type="button" id="start">شروع بازی</button>
  </main>
  <script>
    document.getElementById('start').addEventListener('click', function () {
      this.textContent = 'بازی شروع شد!';
    });
  </script>
</body>
</html>

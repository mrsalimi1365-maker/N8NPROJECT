<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مسابقه پنج سوالی چندگزینه‌ای">
  <title>مسابقه پنج سوالی</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="quiz-card" aria-labelledby="quiz-title">
      <header class="quiz-header">
        <div>
          <p class="eyebrow">آزمون کوتاه دانستنی‌ها</p>
          <h1 id="quiz-title">مسابقه پنج سوالی</h1>
        </div>
        <span class="badge">۵ سؤال</span>
      </header>

      <div id="quiz-view" aria-live="polite">
        <div class="progress-info">
          <span id="question-counter">سؤال ۱ از ۵</span>
          <span id="progress-percent">۲۰٪</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="question-block">
          <h2 id="question-text"></h2>
          <div id="options" class="options" role="radiogroup" aria-label="گزینه‌های پاسخ"></div>
          <p id="error-message" class="error-message" role="alert" hidden>لطفاً یکی از گزینه‌ها را انتخاب کنید.</p>
        </div>

        <div class="actions">
          <button id="previous-button" class="button button-secondary" type="button">سؤال قبلی</button>
          <button id="next-button" class="button button-primary" type="button">سؤال بعدی</button>
        </div>
      </div>

      <section id="result-view" class="result-view" hidden aria-live="polite">
        <div class="result-icon" aria-hidden="true">★</div>
        <p class="eyebrow">مسابقه تمام شد</p>
        <h2>نتیجه شما</h2>
        <p id="result-message" class="result-message"></p>
        <div class="result-grid">
          <div class="result-item"><strong id="correct-count">۰</strong><span>پاسخ درست</span></div>
          <div class="result-item"><strong id="wrong-count">۰</strong><span>پاسخ نادرست</span></div>
          <div class="result-item"><strong id="success-rate">۰٪</strong><span>درصد موفقیت</span></div>
        </div>
        <button id="restart-button" class="button button-primary" type="button">شروع دوباره</button>
      </section>
    </section>
    <p class="footer-note">با تمرکز پاسخ دهید و از یادگیری لذت ببرید!</p>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
